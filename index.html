<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Page Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/js/app.js" defer></script>
  </head>
  <body>
    <main>
      <aside>
        <header>
          <h1>Portmaker</h1>
          <p>A page builder tool</p>
        </header>
        <section>
          <h2>Settings</h2>
          <input
            id="nameInput"
            type="text"
            placeholder="Name"
            data-prop="name"
          />
          <input
            id="pathInput"
            type="text"
            placeholder="Path"
            data-prop="path"
          />
          <select id="categoryInput" data-prop="category">
            <option value="branding">Branding</option>
            <option value="creative_projects">Creative Projects</option>
            <option value="misc">Misc</option>
            <option value="print_&_posters">Print & Posters</option>
          </select>
          <div>
            <label>New</label>
            <input id="newInput" type="checkbox" data-prop="new" />
          </div>
        </section>

        <section id="elements">
          <h2>Elements</h2>
          <div>
            <div>
              <input class="addInput" type="button" value="Header" />
              <input class="addInput" type="button" value="Subheader" />
              <input class="addInput" type="button" value="Paragraph" />
              <input class="addInput" type="button" value="Caption" />
            </div>
            <div>
              <input class="addInput" type="button" value="Image" />
              <input class="addInput" type="button" value="Video" />
              <input class="addInput" type="button" value="Link" />
            </div>
          </div>

          <div id="properties" class="hidden">
            <h2>Properties</h2>
            <div>
              <input type="text" placeholder="Text" />
              <input type="file" placeholder="Path" />
              <input type="text" placeholder="Alt" />
              <input type="text" placeholder="Embed" />
              <input type="text" placeholder="Url" />
            </div>

            <input id="addElInput" type="button" value="Add" />
          </div>
        </section>

        <section>
          <h2>Export</h2>
          <p></p>
          <input id="exportPageBtn" type="button" value="Page" />
          <input id="saveCacheBtn" type="button" value="Save to cache" />
        </section>

        <section>
          <h2>Load</h2>
          <textarea id="loadInput" name="" rows="5" cols="33"></textarea>
          <input id="loadTextBtn" type="button" value="Load" />
          <div class="divider"></div>
          <label>Page</label>
          <input id="loadTextBtn" type="file" value="Load" />
          <div class="divider"></div>
          <label>Cache</label>
          <input id="loadCacheBtn" type="button" value="Load" />
          <div id="options"></div>
        </section>
      </aside>

      <section id="preview">
        <div id="tabs"></div>
        <pre id="json-output"></pre>
        <iframe></iframe>
        <div id="html-output"></div>
      </section>
    </main>
  </body>
</html>
