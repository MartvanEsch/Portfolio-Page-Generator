<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Page Builder</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/js/app.js" defer></script>
  </head>
  <body>
    <main>
      <aside>
        <header>
          <h1>Portmaker</h1>
          <p>A page builder tool</p>
        </header>

        <section>
          <h2>Project Settings</h2>
          <input
            id="nameInput"
            type="text"
            placeholder="Project Name"
            data-prop="name"
          />
          <input
            id="pathInput"
            type="text"
            placeholder="Path"
            data-prop="path"
          />
          <select id="categoryInput" data-prop="category">
            <option value="branding">Branding</option>
            <option value="creative_projects">Creative Projects</option>
            <option value="misc">Misc</option>
            <option value="print_&_posters">Print & Posters</option>
          </select>
        </section>

        <section id="add-elements">
          <h2>Add Elements</h2>
          <div>
            <input class="addInput" type="button" value="Header" />
            <input class="addInput" type="button" value="Paragraph" />
            <input class="addInput" type="button" value="Image" />
            <input class="addInput" type="button" value="Video" />
          </div>
        </section>

        <section id="layers">
          <h2>Page Structure</h2>
          <ul>
            <li><p>Empty</p></li>
          </ul>
        </section>

        <section id="properties" class="hidden">
          <h2>Properties</h2>
          <div>
            <input type="text" placeholder="Text" class="hidden" />
            <button id="imageButton" class="hidden">Image</button>
            <input id="imageInput" type="file" class="hidden" />
            <input type="text" placeholder="Alt" class="hidden" />
            <input type="text" placeholder="Embed" class="hidden" />
            <input type="text" placeholder="Url" class="hidden" />
          </div>

          <button id="addElInput">Add</button>
        </section>

        <section>
          <h2>Storage & Export</h2>
          <div>
            <button id="importPageBtn">Import ZIP</button>
            <input type="file" id="zipInput" class="hidden" />
            <button id="exportPageBtn">Export ZIP</button>
          </div>
        </section>
      </aside>

      <section id="preview">
        <div id="tabs"></div>
        <div>
          <button id="editBtn">Edit</button>
          <button class="hidden" id="saveBtn">Save</button>
          <pre class="hidden" id="json-output"></pre>
          <textarea id="jsonTextArea" class="hidden"></textarea>
        </div>

        <iframe style="aspect-ratio: 4 / 3"></iframe>
        <iframe style="aspect-ratio: 4 / 5"></iframe>
        <iframe style="aspect-ratio: 16 / 9"></iframe>
        <div id="html-output"></div>
      </section>
    </main>
  </body>
</html>
