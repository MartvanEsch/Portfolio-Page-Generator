<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div id="toolbar">
      <div>
        <input class="createBtn" value="h1" data-type="h1" type="button" />
        <input class="createBtn" value="h2" data-type="h2" type="button" />
        <input class="createBtn" value="h3" data-type="h3" type="button" />
        <input class="createBtn" value="p" data-type="p" type="button" />
        <input class="createBtn" value="img" data-type="img" type="button" />
      </div>

      <div>
        <a id="previewLink" href="project.html">Preview project</a>
        <select name="cats" id="cats">
          <option value="branding">branding</option>
          <option value="creative_projects">creative_projects</option>
          <option value="misc">misc</option>
          <option value="print_&_posters">print_&_posters</option>
        </select>
        <label>Project Name</label>
        <input id="name" type="text" />
      </div>
    </div>
    <div id="preview"></div>
    <div id="inputs">
      <div id="text"><label>Text</label> <input type="text" /></div>
      <div id="settings"><label>Path</label> <input type="text" /></div>
    </div>
  </body>
</html>
